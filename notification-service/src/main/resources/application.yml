spring:
  application:
    name: notification-service
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:localhost:9092}
    consumer:
      group-id: notification-service
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.springframework.kafka.support.serializer.JacksonJsonDeserializer
      properties:
        spring.json.value.default.type: ru.aston.notification.dto.UserEvent
        spring.json.trusted.packages: ru.aston.notification.dto
        spring.json.use.type.headers: false
  mail:
    host: ${MAIL_HOST:smtp.gmail.com}
    port: ${MAIL_PORT:587}
    username: ${MAIL_USERNAME:}
    password: ${MAIL_PASSWORD:}
    properties:
      mail.smtp.auth: true
      mail.smtp.starttls.enable: true
app:
  kafka:
    topics:
      user-events: user-events
  mail:
    from: ${MAIL_FROM:${MAIL_USERNAME:no-reply@example.com}}
    subject: Уведомление о статусе аккаунта
  site-name: AstonGroup6
server:
  port: 8081